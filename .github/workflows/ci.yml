name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Core scripts are stdlib-only: run them across the supported Python range.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --group dev pytest
      - name: Compile examples
        run: uv run --python ${{ matrix.python-version }} python -m py_compile examples/*.py

  # Lint + format + type-check with the Astral toolchain (single Python is enough).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      # ty needs the mcp dependency installed to resolve the server's imports.
      - run: uv run --extra mcp --group dev ty check

  # Exercise the optional MCP extra and its tests separately.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run MCP server tests
        run: uv run --extra mcp --group dev pytest tests/test_mcp_server.py
